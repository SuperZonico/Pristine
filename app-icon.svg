<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pristine-diamond-grad" x1="64" y1="40" x2="448" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0a8" />
      <stop offset="45%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="pristine-facet-shine" x1="160" y1="100" x2="352" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0a8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="pristine-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background facet -->
  <polygon points="256,40 352,200 256,360 160,200" fill="url(#pristine-facet-shine)" />

  <!-- Outer diamond contour -->
  <polygon points="256,40 448,140 448,360 256,460 64,360 64,140" 
           stroke="url(#pristine-diamond-grad)" stroke-width="24" stroke-linejoin="round" fill="none" filter="url(#pristine-glow)"/>

  <!-- Inner facet edges -->
  <line x1="256" y1="40" x2="256" y2="360" stroke="url(#pristine-diamond-grad)" stroke-width="14" stroke-linecap="round" />
  <line x1="64" y1="140" x2="160" y2="200" stroke="url(#pristine-diamond-grad)" stroke-width="14" stroke-linecap="round" />
  <line x1="448" y1="140" x2="352" y2="200" stroke="url(#pristine-diamond-grad)" stroke-width="14" stroke-linecap="round" />
  <line x1="160" y1="200" x2="64" y2="360" stroke="url(#pristine-diamond-grad)" stroke-width="14" stroke-linecap="round" />
  <line x1="352" y1="200" x2="448" y2="360" stroke="url(#pristine-diamond-grad)" stroke-width="14" stroke-linecap="round" />
  <line x1="256" y1="360" x2="256" y2="460" stroke="url(#pristine-diamond-grad)" stroke-width="14" stroke-linecap="round" />
</svg>
